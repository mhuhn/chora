<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chora</title>
<meta name="description" content="Aufgaben und Punkte für deinen Chor">
<meta name="theme-color" content="#f7f8f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12150d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chora">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap">
<script>window.CHORA_PWA = true; window.CHORA_VERSION = "1.5.0";</script>
</head>
<body>
<style>
/* Layout: Smartphone = Kopfzeile, eine Spalte, Tab-Leiste unten.
   Ab 768px = Liste links + Detail rechts. Ab 900px = Navigationsleiste links statt unten. */
:root {
  --bg: #f7f8f1;
  --surface: #ffffff;
  --surface-2: #eff1e4;
  --ink: #1d2210;
  --muted: #5f6750;
  --line: #e1e4d3;
  --green: #c7d01c;          /* Logo-Grün, für Flächen */
  --green-soft: #eef2bf;
  --green-ink: #566100;      /* Grün als Text auf hellem Grund */
  --orange: #e8600b;         /* Logo-Orange, für Aktionen */
  --orange-soft: #fde4d2;
  --orange-ink: #b9480a;
  --on-orange: #ffffff;
  --on-green: #1d2210;
  --danger: #b42318;
  --gold: #a57800; --gold-soft: #fbefc5; --silver: #5f6b78; --silver-soft: #e7ebef;
  --shadow: 0 1px 2px rgba(40, 48, 10, .06), 0 4px 16px rgba(40, 48, 10, .06);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12150d; --surface: #1b1f14; --surface-2: #232819; --ink: #eef1e2; --muted: #a4ab91;
    --line: #2d3322; --green: #c7d01c; --green-soft: #343b12; --green-ink: #d6de52;
    --orange: #f2701c; --orange-soft: #3d2312; --orange-ink: #ff9a57; --on-orange: #1a0d03; --on-green: #1d2210;
    --danger: #ff8a7a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
    --gold: #f0c445; --gold-soft: #3a3011; --silver: #c3ccd6; --silver-soft: #2a2f35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12150d; --surface: #1b1f14; --surface-2: #232819; --ink: #eef1e2; --muted: #a4ab91;
  --line: #2d3322; --green: #c7d01c; --green-soft: #343b12; --green-ink: #d6de52;
  --orange: #f2701c; --orange-soft: #3d2312; --orange-ink: #ff9a57; --on-orange: #1a0d03; --on-green: #1d2210;
  --danger: #ff8a7a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
  --gold: #f0c445; --gold-soft: #3a3011; --silver: #c3ccd6; --silver-soft: #2a2f35;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--body); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#root { height: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Buttons & Formulare ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px; border-radius: 12px; border: 0;
  font-weight: 650; font-size: 16px; text-decoration: none;
  transition: transform .08s ease, filter .15s ease;
}
.btn:active { transform: scale(.98); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-primary { background: var(--orange); color: var(--on-orange); }
.btn-primary:hover { filter: brightness(1.05); }
.btn-secondary { background: var(--surface-2); color: var(--ink); }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-danger { background: transparent; color: var(--danger); }
.btn-block { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: default; transform: none; }
.btn-done { background: var(--green-soft); color: var(--green-ink); opacity: 1 !important; }
.link { background: none; border: 0; padding: 4px 2px; color: var(--orange-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.field { display: grid; gap: 6px; align-content: start; }
.field label { font-size: 14px; font-weight: 600; }
.field .hint { font-size: 13px; color: var(--muted); }
.field .err { font-size: 13px; color: var(--danger); font-weight: 600; }
.input, .select {
  width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface);
  font-size: 16px; /* verhindert Zoom auf iOS */
}
.input:focus, .select:focus { outline: none; border-color: var(--green-ink); box-shadow: 0 0 0 3px var(--green-soft); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.form { display: grid; gap: 16px; }
.form-error { background: var(--orange-soft); color: var(--orange-ink); padding: 12px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; }

.voices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.voice-opt { position: relative; }
.voice-opt input { position: absolute; opacity: 0; inset: 0; }
.voice-opt span {
  display: grid; place-items: center; min-height: 48px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; text-align: center; line-height: 1.15; padding: 4px;
}
.voice-opt input:checked + span { background: var(--green); border-color: var(--green); color: var(--on-green); }
.voice-opt input:focus-visible + span { outline: 3px solid var(--orange); outline-offset: 2px; }
.voice-opt.wide { grid-column: span 2; }

/* ---------- Anmeldung ---------- */
.auth { min-height: 100%; display: grid; grid-template-columns: 1fr; background: var(--bg); }
.auth-hero { display: none; }
.auth-main { display: grid; align-content: center; justify-items: center; padding-block: 32px; overflow-y: auto; }
.auth-card { width: 100%; max-width: 420px; display: grid; gap: 22px; }
.brand { display: grid; justify-items: center; gap: 8px; text-align: center; }
.brand img { width: 84px; height: 84px; border-radius: 20px; box-shadow: var(--shadow); }
.brand h1 { font-size: 40px; font-weight: 800; letter-spacing: -.03em; }
.brand p { margin: 0; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; min-height: 40px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.auth-step { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--orange-ink); }
.auth-title { font-size: 26px; }
.auth-text { margin: 0; color: var(--muted); }
.code-input { letter-spacing: .5em; text-align: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.demo-note { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.auth-foot { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }

@media (min-width: 900px) {
  .auth { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .auth-hero {
    display: grid; align-content: center; justify-items: start; gap: 24px;
    background: var(--green); color: var(--on-green); padding: 48px max(48px, env(safe-area-inset-left, 0px));
  }
  .auth-hero img { width: 140px; height: 140px; border-radius: 32px; box-shadow: 0 8px 30px rgba(40,48,10,.25); }
  .auth-hero h2 { font-size: 56px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .auth-hero p { margin: 0; font-size: 20px; max-width: 26ch; line-height: 1.35; }
  .auth-hero .stripe { width: 56px; height: 6px; border-radius: 3px; background: var(--orange); }
  .auth-main .brand { display: none; }
}

/* ---------- App-Rahmen ---------- */
.app {
  height: 100%; display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top" "main" "nav";
}
.topbar {
  grid-area: top; display: flex; align-items: center; gap: 10px;
  min-height: 56px; padding-block: 8px; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topbar img { width: 30px; height: 30px; border-radius: 8px; }
.topbar h1 { font-size: 22px; font-weight: 750; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); margin-left: -8px; }
.icon-btn svg { width: 24px; height: 24px; }
.main { grid-area: main; display: flex; min-height: 0; min-width: 0; }

.nav {
  grid-area: nav; display: grid; grid-template-columns: repeat(var(--tabs, 4), 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.nav-logo { display: none; }
.nav button {
  display: grid; justify-items: center; align-content: center; gap: 2px; min-height: var(--nav-h);
  border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600;
}
.nav .ico { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 15px; transition: background .15s ease; }
.nav svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"] .ico { background: var(--green); color: var(--on-green); }

@media (min-width: 900px) {
  .app { grid-template-columns: 96px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "nav top" "nav main"; }
  .nav { grid-template-columns: 1fr !important; grid-auto-rows: min-content; align-content: start; gap: 6px; border-top: 0; border-right: 1px solid var(--line); padding: 16px 0 16px env(safe-area-inset-left, 0px); }
  .nav-logo { display: grid; place-items: center; padding-bottom: 14px; }
  .nav-logo img { width: 52px; height: 52px; border-radius: 14px; }
  .nav button { min-height: 68px; font-size: 13px; }
  .topbar img { display: none; }
  .topbar { min-height: 64px; }
  .topbar h1 { font-size: 26px; }
}

/* ---------- Bereiche ---------- */
.pane { flex: 1; min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.split { display: flex; flex: 1; min-width: 0; min-height: 0; }
.list-pane { flex: 1; min-width: 0; overflow-y: auto; }
.detail-pane { display: none; }
@media (min-width: 768px) {
  .list-pane { flex: 0 0 auto; width: clamp(320px, 40%, 440px); border-right: 1px solid var(--line); }
  .detail-pane { display: block; flex: 1; min-width: 0; overflow-y: auto; background: var(--surface); }
}
.pad { padding-block: 16px 24px; }

.toolbar { display: grid; gap: 10px; padding-block: 12px; background: var(--bg); position: sticky; top: 0; z-index: 3; border-bottom: 1px solid var(--line); }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search .input { padding-left: 40px; min-height: 44px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; padding: 0 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; min-height: 34px; padding: 0 12px; font-size: 14px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.group-h {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
  padding-block: 18px 6px; background: var(--bg);
  font-size: 12px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; color: var(--green-ink);
}
.group-h::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.group-h .count { color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.list-pane .group-h { top: var(--tb-h, 0px); }

.rows { list-style: none; margin: 0; padding: 0; }
.row {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  padding-block: 12px; border: 0; background: transparent; border-bottom: 1px solid var(--line);
}
.row:hover { background: var(--surface-2); }
.row[aria-current="true"] { background: var(--green-soft); }
.row[aria-current="true"] .row-title { color: var(--ink); }
.row-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row-title { font-weight: 650; overflow-wrap: anywhere; }
.row-sub { font-size: 14px; color: var(--muted); }
.row-meta { flex: none; display: grid; justify-items: end; gap: 5px; text-align: right; }
.seats { font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
.seatbar { width: 64px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.seatbar i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
.seatbar.full i { background: var(--muted); }
.row-chev { flex: none; width: 18px; height: 18px; color: var(--muted); }
@media (min-width: 768px) { .row-chev { display: none; } }
.mine-dot { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--orange-soft); color: var(--orange-ink); font-size: 11px; font-weight: 750; letter-spacing: .04em; vertical-align: 2px; }

.avatar { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 750; font-size: 15px; background: var(--surface-2); color: var(--ink); }
.avatar.me { background: var(--green); color: var(--on-green); }
.vtag { display: inline-block; min-width: 30px; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); font-size: 12px; font-weight: 750; text-align: center; color: var(--muted); }
.cid { font-weight: 650; color: var(--ink); }
.pts-line { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.missing { display: grid; justify-items: end; line-height: 1.1; }
.missing b { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; color: var(--ink); }

/* ---------- Detail ---------- */
.detail { display: grid; gap: 22px; padding-block: 20px 32px; max-width: 720px; }
@media (min-width: 768px) { .detail { padding-block: 32px 40px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
.eyebrow { font-size: 12px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; color: var(--green-ink); }
.detail h2 { font-size: 30px; line-height: 1.12; font-weight: 750; }
.headline { display: grid; gap: 8px; }
.scope { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.scope b { font-family: var(--display); font-size: 44px; line-height: 1; font-weight: 800; color: var(--orange-ink); font-variant-numeric: tabular-nums; }
.scope span { font-size: 18px; color: var(--muted); font-weight: 600; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--green); }
.dots i.on { background: var(--green); }
.dots i.me { background: var(--orange); border-color: var(--orange); }
.dots-cap { font-size: 14px; color: var(--muted); }
.props { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; margin: 0; border-top: 1px solid var(--line); }
.props div { padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.props div:nth-child(odd) { padding-right: 12px; }
.props dt { font-size: 13px; color: var(--muted); font-weight: 600; }
.props dd { margin: 2px 0 0; font-weight: 650; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.cta { display: grid; gap: 10px; }
.cta-note { font-size: 14px; color: var(--muted); text-align: center; margin: 0; }
.empty { display: grid; place-items: center; align-content: center; gap: 10px; height: 100%; min-height: 240px; color: var(--muted); text-align: center; padding: 24px; }
.empty svg { width: 40px; height: 40px; color: var(--green-ink); opacity: .7; }

.person { display: flex; align-items: center; gap: 16px; }
.person .avatar { width: 64px; height: 64px; font-size: 22px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: var(--radius); padding: 14px; display: grid; gap: 2px; min-width: 0; }
.stat span { font-size: 13px; font-weight: 600; color: var(--muted); }
.stat b { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat.orange b { color: var(--orange-ink); }
.stat.green b { color: var(--green-ink); }
.meter { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--green), var(--green)); }
.meter-cap { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 6px; }

/* ---------- Punkte ---------- */
.points { display: grid; gap: 24px; padding-block: 20px 32px; }
.points-sum { display: grid; gap: 14px; align-content: start; }
.big-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big-stat { border-radius: 18px; padding: 16px; display: grid; gap: 4px; }
.big-stat span { font-size: 14px; font-weight: 650; }
.big-stat b { font-family: var(--display); font-size: 48px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
.big-stat small { font-size: 13px; opacity: .8; }
.big-stat.committed { background: var(--surface); border: 1.5px solid var(--line); }
.big-stat.collected { background: var(--green); color: var(--on-green); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.section-h h2 { font-size: 20px; }
.section-h span { font-size: 14px; color: var(--muted); }
.check { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.check-title { font-weight: 650; overflow-wrap: anywhere; }
.check-pts { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--green-ink); font-variant-numeric: tabular-nums; text-align: right; }
.check-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); }
.check-meta .checker { display: inline-flex; align-items: center; gap: 5px; }
.check-meta svg { width: 15px; height: 15px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink); font-weight: 650; font-size: 13px; }
@media (min-width: 900px) {
  .points { grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 40px; padding-block: 32px; }
  .points-sum { position: sticky; top: 32px; }
}

/* ---------- Profil ---------- */
.profile { display: grid; gap: 24px; padding-block: 20px 32px; max-width: 640px; }
.profile-card { display: flex; align-items: center; gap: 16px; }
.profile-card .avatar { width: 64px; height: 64px; font-size: 22px; }
.profile-card h2 { font-size: 24px; }
.profile-card p { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.two { display: grid; gap: 16px; }
@media (min-width: 600px) { .two { grid-template-columns: 1fr 1fr; } }
.profile-actions { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
@media (min-width: 900px) { .profile { padding-block: 32px; margin-inline: auto; } }

/* ---------- Level ---------- */
.year { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.year b { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.year span { font-size: 13px; color: var(--muted); text-align: right; max-width: 22ch; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

function chorIdExample(p) {
  const k = p.voice && p.voice !== "U" ? p.voice : "A1";

function readProfile(form) {
  const f = new FormData(form);

  chorId = chorId.replace(/^(b|t|a1|a2|s1|s2)-/i, m => m.toUpperCase());
  return { firstName: String(f.get("firstName") || "").trim(), lastName: String(f.get("lastName") || "").trim(), voice: f.get("voice") || "", chorId };
}
function validateProfile(p) {
  const e = {};
  if (!p.firstName) e.firstName = "Bitte gib deinen Vornamen ein.";
  if (!p.lastName) e.lastName = "Bitte gib deinen Nachnamen ein.";
  if (!p.voice) e.voice = "Bitte wähle eine Stimmgruppe. Wenn du es nicht weißt, wähle „unbekannt“.";
  if (!p.chorId) e.chorId = "Bitte gib deine Chor-ID ein.";
  else if (!CHOR_ID_RE.test(p.chorId)) e.chorId = "So sieht eine Chor-ID aus: Kürzel (B, T, A1, A2, S1, S2), Bindestrich, Name aus Buchstaben, z. B. S2-Marie-Luise.";

}

  const title = catsOpen && !wide() ? "Kategorien" : isNew && !wide() ? "Neue Aufgabe" : S.tab === "tasks" && S.editTask && can("aufgabenverwalter") && !wide() ? "Aufgabe bearbeiten" : tab.label;

  else if (S.tab === "points") content = pointsView();
  else if (S.tab === "members") content = membersView();
  else if (S.tab === "checks") content = checksView();

/* ---------- Aufgaben ---------- */
function filteredTasks() {
  const q = S.q.trim().toLowerCase();
  const u = me();
  return DB.tasks.filter(t => (!S.onlyMine || u.claims.includes(t.id)) && (!q || t.title.toLowerCase().includes(q) || t.category.toLowerCase().includes(q)));
}
function taskRow(t) {
  const u = me(), mine = u.claims.includes(t.id), full = t.assigned >= t.total;
  return `<li><button class="row gutter" data-act="task" data-id="${t.id}" ${S.taskId === t.id && wide() ? 'aria-current="true"' : ""}>
    <span class="row-main"><span class="row-title">${esc(t.title)}${mine ? mineTag(t.id) : ""}</span>
    <span class="row-sub num">${scopeText(t)}</span></span>
    <span class="row-meta"><span class="seats">${t.assigned} von ${seatsText(t)}</span><span class="seatbar${full ? " full" : ""}"><i style="width:${Math.round(t.assigned / t.total * 100)}%"></i></span></span>
    ${I.chev}</button></li>`;
}
function mineTag(id) {
  const r = Api.myReport(id);
  if (r && r.status === "reported") return '<span class="mine-dot wait">GEMELDET</span>';
  if (r && r.status === "rejected") return '<span class="mine-dot no">ABGELEHNT</span>';
  return '<span class="mine-dot">DEINE</span>';
}
function taskListHTML() {
  const list = filteredTasks();
  if (!DB.tasks.length) return `<div class="empty">${I.tasks}<div>Es gibt noch keine Aufgaben.${can("aufgabenverwalter") ? "<br>Leg die erste mit „Neue Aufgabe“ an." : ""}</div></div>`;
  if (!list.length) return S.onlyMine && !S.q
    ? `<div class="empty">${I.tasks}<div>Du hast noch keine Aufgabe übernommen.</div></div>`
    : `<div class="empty">${I.search}<div>Keine Aufgabe passt zu „${esc(S.q)}“.</div></div>`;
  if (S.group === "az") {
    return `<ul class="rows">${[...list].sort((a, b) => a.title.localeCompare(b.title, "de")).map(taskRow).join("")}</ul>`;
  }
  const order = Api.categories();
  const cats = [...new Set(list.map(t => t.category))].sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b, "de");
  });
  return cats.map(c => {
    const items = list.filter(t => t.category === c);
    return `<section><h3 class="group-h gutter">${esc(c)} <span class="count">${items.length}</span></h3><ul class="rows">${items.map(taskRow).join("")}</ul></section>`;
  }).join("");
}
function tasksView() {
  const isNew = S.editTask === "new" && can("aufgabenverwalter");
  const catsOpen = S.cats && can("aufgabenverwalter");
  if (wide() && !S.taskId && !isNew && !catsOpen && DB.tasks.length) S.taskId = firstVisibleTaskId();
  const showDetail = !wide() && (S.taskId || isNew || catsOpen);
  const t = DB.tasks.find(x => x.id === S.taskId);
  const editing = S.editTask && S.editTask === S.taskId && can("aufgabenverwalter");
  const detail = catsOpen ? categoriesView() : isNew ? taskEdit(null) : t ? (editing ? taskEdit(t) : taskDetail(t)) : "";
  if (showDetail) return `<div class="pane">${detail}</div>`;
  return `<div class="split">
    <div class="list-pane" id="list-pane">
      <div class="toolbar gutter" id="tb">
        <div class="search">${I.search}<label class="sr" for="q">Aufgaben durchsuchen</label><input class="input" id="q" type="search" placeholder="Aufgabe suchen" value="${esc(S.q)}" autocomplete="off"></div>
        <div class="chips" role="group" aria-label="Sortierung">
          <button class="chip" data-act="group" data-g="cat" aria-pressed="${S.group === "cat"}">Nach Kategorie</button>
          <button class="chip" data-act="group" data-g="az" aria-pressed="${S.group === "az"}">A–Z</button>
          <span class="chip-sep" aria-hidden="true"></span>
          <button class="chip" data-act="only-mine" aria-pressed="${!!S.onlyMine}">Meine</button>
        </div>
      </div>
      <div id="task-list">${taskListHTML()}</div>
    </div>
    <div class="detail-pane" id="detail-pane">${detail || `<div class="empty">${I.tasks}<div>${DB.tasks.length ? "Wähle links eine Aufgabe." : "Es gibt noch keine Aufgaben."}</div></div>`}</div>
  </div>`;
}
function firstVisibleTaskId() {
  const l = filteredTasks();
  if (!l.length) return null;
  if (S.group === "az") return [...l].sort((a, b) => a.title.localeCompare(b.title, "de"))[0].id;
  const cats = Api.categories().filter(c => l.some(t => t.category === c));
  return (l.find(t => t.category === cats[0]) || l[0]).id;
}
function taskDetail(t) {
  if (!t) return `<div class="empty">${I.tasks}<div>Diese Aufgabe gibt es nicht mehr.</div></div>`;
  const u = me(), mine = u.claims.includes(t.id), full = t.assigned >= t.total, free = t.total - t.assigned;
  const today = todayISO(), notYet = today < t.validFrom, expired = !!t.validTo && today > t.validTo;
  let btn, note = "";
  if (mine) {
    const r = Api.myReport(t.id), last = lastCheckFor(t.id);
    const markBtn = `<button class="btn btn-primary btn-block" data-act="done" data-id="${t.id}" ${S.busy ? "disabled" : ""}>${S.busy ? '<span class="spinner"></span>' : I.check}Als erledigt melden</button>`;
    if (r && r.status === "reported") {
      btn = `<div class="status wait" role="status"><b>Als erledigt gemeldet am ${fmtDate(r.date)}</b>Ein Aufgabenchecker bestätigt das noch.</div>
        <button class="btn btn-secondary btn-block" data-act="undo-done" data-id="${t.id}">${I.reset}Meldung zurücknehmen</button>`;
    } else if (r && r.status === "rejected") {
      btn = `<div class="status no" role="status"><b>Abgelehnt${r.checker ? ` von ${esc(r.checker)}` : ""}${r.decidedAt ? ` am ${fmtDate(r.decidedAt)}` : ""}</b>
        ${r.comment ? `<blockquote>${esc(r.comment)}</blockquote>` : "Es wurde kein Kommentar angegeben."}</div>${markBtn}`;
    } else btn = markBtn;
    note = last ? `Zuletzt bestätigt am ${fmtDate(last.date)} von ${esc(last.checker)}.` : "Du hast diese Aufgabe übernommen. Melde sie, sobald du sie erledigt hast.";
  }
  else if (expired) { btn = `<button class="btn btn-primary btn-block" disabled>Aufgabe übernehmen</button>`; note = `Die Aufgabe war nur bis ${fmtDate(t.validTo)} gültig.`; }
  else if (notYet) { btn = `<button class="btn btn-primary btn-block" disabled>Aufgabe übernehmen</button>`; note = `Du kannst die Aufgabe ab ${fmtDate(t.validFrom)} übernehmen.`; }
  else if (full) { btn = `<button class="btn btn-primary btn-block" disabled>Aufgabe übernehmen</button>`; note = "Alle Plätze sind vergeben."; }
  else { btn = `<button class="btn btn-primary btn-block" data-act="claim" data-id="${t.id}" ${S.busy ? "disabled" : ""}>${S.busy ? '<span class="spinner"></span>' : I.plus}Aufgabe übernehmen</button>`; note = free === 1 ? "Noch 1 Platz frei." : `Noch ${free} Plätze frei.`; }
  const dots = t.total <= 50 ? `<div class="dots" aria-hidden="true">${Array.from({ length: t.total }, (_, i) => `<i class="${[i < t.assigned ? (mine && i === t.assigned - 1 ? "me" : "on") : "", i < (t.min || 0) ? "req" : ""].join(" ").trim()}"></i>`).join("")}</div>` : "";
  const below = (t.min || 0) - t.assigned;
  const seatCap = `${t.assigned} von ${t.total} Plätzen vergeben${t.min && t.min !== t.total ? ` · mindestens ${t.min}` : ""}${below > 0 ? ` · ${below === 1 ? "es fehlt noch 1 Person" : `es fehlen noch ${below} Personen`}` : ""}`;
  return `<article class="detail gutter">
    <div class="headline"><div class="detail-actions"><div class="eyebrow">${esc(t.category)}</div>
      ${can("aufgabenverwalter") ? `<button class="btn btn-secondary btn-sm" data-act="edit-task" data-id="${t.id}">${I.edit}Bearbeiten</button>` : ""}</div>
      <h2>${esc(t.title)}</h2>
      ${t.description ? `<p class="task-desc">${esc(t.description)}</p>` : ""}</div>
    <div class="scope"><b>${P(t.points)}</b><span>pro ${INTERVALS[t.interval]}</span></div>
    <div style="display:grid;gap:8px">${dots}<div class="dots-cap num">${seatCap}</div></div>
    <dl class="props">

    <div class="three">${num("points", "Punkte (p)", 1)}${num("min", "Plätze min.", 1, 50)}${num("total", "Plätze max.", 1, 50)}</div>
    ${isNew ? "" : `<p class="cta-note" style="text-align:left;margin:-8px 0 0">Vergeben: ${t.assigned}. Die Zahl ergibt sich aus den Übernahmen im laufenden Jahr.</p>`}
    <div class="two">
      <div class="field"><label for="te-validFrom">Gültig ab</label>
        <input class="input" id="te-validFrom" name="validFrom" type="date" value="${esc(d.validFrom)}"${inv("validFrom")}>${fieldErr("validFrom")}</div>
      <div class="field"><label for="te-validTo">Gültig bis</label>
        <input class="input" id="te-validTo" name="validTo" type="date" value="${esc(d.validTo || "")}"${inv("validTo")}>
        ${S.errors.validTo ? fieldErr("validTo") : '<div class="hint">Leer lassen = dauerhaft gültig.</div>'}</div>
    </div>
    <div class="edit-actions">
      <button class="btn btn-primary" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? '<span class="spinner"></span>' : (isNew ? I.plus : I.save)}${isNew ? "Aufgabe anlegen" : "Speichern"}</button>
      ${isNew ? `<button class="btn btn-secondary" type="submit" data-next="1" ${S.busy ? "disabled" : ""}>${I.plus}Anlegen und weitere</button>` : ""}
      <button class="btn btn-ghost" type="button" data-act="cancel-edit">Abbrechen</button>
    </div>
  </form>`;
}
function readTask(f) {
  const g = k => String(new FormData(f).get(k) || "").trim();
  const n = k => /^\d+$/.test(g(k)) ? parseInt(g(k), 10) : NaN;
  return { title: g("title"), description: g("description"), category: g("category"), interval: g("interval"), points: n("points"),
    min: n("min"), total: n("total"), validFrom: g("validFrom"), validTo: g("validTo") };
}
function validateTask(t, existing) {
  const e = {};
  if (!t.title) e.title = "Bitte gib einen Titel ein.";
  if (!t.category) e.category = "Bitte wähle eine Kategorie.";
  if (!(t.points >= 1)) e.points = "Ganze Zahl ab 1.";
  if (!(t.min >= 1 && t.min <= 50)) e.min = "Ganze Zahl von 1 bis 50.";
  if (!(t.total >= 1 && t.total <= 50)) e.total = "Ganze Zahl von 1 bis 50.";
  else if (t.min >= 1 && t.total < t.min) e.total = "Mindestens so viele wie das Minimum.";
  else if (existing && t.total < existing.assigned) e.total = `Es sind schon ${existing.assigned} Plätze vergeben.`;
  if (!t.validFrom) e.validFrom = "Bitte wähle ein Datum.";
  if (t.validTo && t.validFrom && t.validTo < t.validFrom) e.validTo = "Muss am oder nach „Gültig ab“ liegen.";
  return e;
}

function pointsView() {
  const u = me(), p = Api.pointsOf(u), sum = p.committed + p.collected, lv = levelOf(sum);

    <section class="points-sum" aria-label="Übersicht">

      <div class="trio">
        <div class="big-stat collected"><span>Gesammelt</span><b>${P(p.collected)}</b><small>${u.checks.length} ${u.checks.length === 1 ? "Check" : "Checks"}</small></div>
        <div class="big-stat committed"><span>Zugesagt</span><b>${P(p.committed)}</b><small>${u.claims.length} ${u.claims.length === 1 ? "Aufgabe" : "Aufgaben"}</small></div>
        <div class="big-stat sum"><span>Summe</span><b>${P(sum)}</b><small>für dein Level</small></div>
      </div>

        <div>
          <div class="track" role="img" aria-label="Summe ${sum} Punkte, Level ${lv.name}"><i style="width:${pos(sum)}%"></i>${LEVELS.slice(1).map(l => `<s style="left:${pos(l.min)}%"></s>`).join("")}</div>
          <div class="track-labels">${LEVELS.map(l => `<span style="left:${pos(l.min)}%">${l.name}<b>${P(l.min)}</b></span>`).join("")}</div>

function reportCard(r) {
  const t = r.task || { title: "Aufgabe", points: 0 };
  const who = r.reporter.chorId ? `<span class="badge">${esc(r.reporter.chorId)}</span>` : "ohne Chor-ID";

    </form>`;
  else {
    const off = !me().profile.chorId || S.busy ? "disabled" : "";
    actions = `<div class="report-actions">

  }
  return `<li class="report">

    <div class="check-meta"><span>gemeldet am <span class="num">${fmtDate(r.date)}</span></span><span class="checker">von ${who}</span></div>

}

        ? `<div class="form-error" style="display:grid;gap:10px">Alle Konten und Beispieldaten in diesem Browser löschen?
            <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" data-act="reset-yes">Ja, zurücksetzen</button><button class="btn btn-secondary" data-act="reset-no">Abbrechen</button></div></div>`
        : `<button class="btn btn-ghost" data-act="reset">${I.reset}Prototyp-Daten zurücksetzen</button>`) : ""}
    </div>
  </div></div>`;
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, undo) {
  clearTimeout(toastTimer);
  const host = $("#toast-host");
  host.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${undo ? '<button data-act="undo">Rückgängig</button>' : ""}</div>`;
  toastTimer = setTimeout(() => { host.innerHTML = ""; S.undo = null; }, 5000);
  S.undo = undo || null;
}

/* =====================================================================
   Rendern & Ereignisse
   ===================================================================== */
function render() {
  S.screen = decideScreen();
  const root = $("#root");
  const keep = keepScroll();
  if (S.screen === "loading") root.innerHTML = `<div class="auth"><main class="auth-main gutter"><div class="brand"><img src="${LOGO}" alt=""><h1>Chora</h1><p><span class="spinner" style="display:inline-block;vertical-align:-3px"></span> Daten werden geladen …</p></div></main></div>`;
  else if (S.screen === "login") root.innerHTML = viewLogin();
  else if (S.screen === "register") root.innerHTML = viewLogin();
  else if (S.screen === "verify") root.innerHTML = viewVerify();
  else if (S.screen === "onboarding") root.innerHTML = viewOnboarding();
  else root.innerHTML = viewApp();
  restoreScroll(keep);
  const tb = $("#tb"); if (tb) $("#list-pane").style.setProperty("--tb-h", tb.offsetHeight + "px");
}
function keepScroll() { const l = $("#list-pane"); return l ? { key: S.tab, top: l.scrollTop } : null; }
function restoreScroll(k) { const l = $("#list-pane"); if (k && l && k.key === S.tab) l.scrollTop = k.top; }
function setTab(tab) {
  S.tab = tab; S.error = ""; S.errors = {}; S.profileDraft = null; S.confirmReset = false; S.editTask = null; S.taskDraft = null; S.confirmDeact = null; S.rejecting = null; S.cats = false; S.catEdit = null;
  if (!wide()) { S.taskId = null; S.memberId = null; }
  DB.ui = { tab }; saveDB(); render();
  const pane = document.querySelector(".pane, .list-pane"); if (pane) pane.scrollTop = 0;
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "mode") return go({ authMode: el.dataset.mode, error: "", errors: {}, email: ($("#email") || {}).value || S.email });
  if (a === "demo") { await Api.loginDemo(el.dataset.kind); S.taskId = S.memberId = null; return go({ error: "", errors: {}, tab: "tasks" }); }
  if (a === "to-login") return go({ screen: "login", authMode: "login", error: "" });
  if (a === "resend") { try { await Api.resend(S.email); toast("Neuer Code ist unterwegs."); } catch (err) { go({ error: err.message }); } return; }
  if (a === "logout") { $("#toast-host").innerHTML = ""; await Api.logout(); S.taskId = S.memberId = S.editTask = null; return go({ screen: "login", authMode: "login", error: "", errors: {}, draft: null }); }
  if (a === "tab") return setTab(el.dataset.tab);
  if (a === "back") {
    if (S.cats) { S.cats = false; S.catEdit = null; S.errors = {}; return render(); }
    if (S.editTask) { S.editTask = null; S.taskDraft = null; S.errors = {}; S.error = ""; return render(); }
    S.taskId = null; S.memberId = null; S.confirmDeact = null; return render();
  }
  if (a === "edit-task") { S.editTask = el.dataset.id; S.taskDraft = null; S.errors = {}; S.error = ""; render(); scrollDetailTop(); return; }
  if (a === "cats") { S.cats = true; S.editTask = null; S.catEdit = null; S.errors = {}; S.error = ""; if (!wide()) S.taskId = null; render(); scrollDetailTop(); return; }
  if (a === "cats-close") { S.cats = false; S.catEdit = null; S.errors = {}; render(); return; }
  if (a === "cat-edit") { S.catEdit = el.dataset.name; S.errors = {}; render(); const i = $("#cat-ren"); if (i) { i.focus(); i.select(); } return; }
  if (a === "cat-cancel") { S.catEdit = null; S.errors = {}; render(); return; }
  if (a === "cat-del") {
    try { await Api.deleteCategory(el.dataset.name); render(); toast("Kategorie gelöscht."); } catch (err) { toast(err.message); }
    return;
  }
  if (a === "new-task") { S.taskId = null; S.cats = false; S.editTask = "new"; S.taskDraft = null; S.errors = {}; S.error = ""; if (wide()) markCurrent(null); render(); scrollDetailTop(); return; }
  if (a === "cancel-edit") { S.editTask = null; S.taskDraft = null; S.errors = {}; S.error = ""; render(); return; }
  if (a === "deact") { S.confirmDeact = el.dataset.id; return render(); }
  if (a === "deact-no") { S.confirmDeact = null; return render(); }
  if (a === "deact-yes" || a === "react") {
    const id = el.dataset.id, on = a === "react";
    try { await Api.setActive(id, on); S.confirmDeact = null; render(); toast(on ? "Mitglied aktiviert." : "Mitglied deaktiviert."); }
    catch (err) { toast(err.message); }
    return;
  }
  if (a === "group") { S.group = el.dataset.g; if (wide()) S.taskId = null; return render(); }
  if (a === "only-mine") { S.onlyMine = !S.onlyMine; if (wide()) S.taskId = null; return render(); }
  if (a === "done" || a === "undo-done") {
    const id = el.dataset.id; S.busy = true; render();
    try {
      if (a === "done") { await Api.markDone(id); S.busy = false; render(); toast("Als erledigt gemeldet.", async () => { await Api.undoDone(id); render(); }); }
      else { await Api.undoDone(id); S.busy = false; render(); toast("Meldung zurückgenommen."); }
    } catch (err) { S.busy = false; render(); toast(err.message); }
    return;
  }
  if (a === "confirm") {
    S.busy = true; render();
    try { await Api.confirmReport(el.dataset.id); S.busy = false; render(); toast("Bestätigt. Die Punkte sind gutgeschrieben."); }
    catch (err) { S.busy = false; render(); toast(err.message); }
    return;
  }
  if (a === "reject") { S.rejecting = el.dataset.id; render(); const ta = document.getElementById("rc-" + S.rejecting); if (ta) ta.focus(); return; }
  if (a === "reject-cancel") { S.rejecting = null; return render(); }
  if (a === "vf") { S.voiceFilter = el.dataset.v; if (wide()) S.memberId = null; return render(); }
  if (a === "task") {
    if (S.cats) { S.cats = false; S.catEdit = null; S.taskId = el.dataset.id; S.editTask = null; render(); return; }
    S.taskId = el.dataset.id; S.editTask = null; S.taskDraft = null; S.errors = {}; S.error = "";
    if (wide()) { $("#detail-pane").innerHTML = taskDetail(DB.tasks.find(t => t.id === S.taskId)); $("#detail-pane").scrollTop = 0; markCurrent(el); }
    else { render(); $(".pane").scrollTop = 0; }
    return;
  }
  if (a === "member") {
    S.memberId = el.dataset.id; S.confirmDeact = null;
    if (wide()) { $("#detail-pane").innerHTML = memberDetail(Api.members().find(m => m.id === S.memberId)); $("#detail-pane").scrollTop = 0; markCurrent(el); }
    else { render(); $(".pane").scrollTop = 0; }
    return;
  }
  if (a === "claim") {
    const id = el.dataset.id; S.busy = true; render();
    try {
      await Api.claim(id); S.busy = false; render();
      const t = DB.tasks.find(x => x.id === id);
      toast(`Übernommen: ${P(t.points)} zugesagt`, async () => { await Api.unclaim(id); render(); toast("Übernahme zurückgenommen."); });
    } catch (err) { S.busy = false; render(); toast(err.message); }
    return;
  }
  if (a === "undo") { const u = S.undo; $("#toast-host").innerHTML = ""; S.undo = null; if (u) u(); return; }
  if (a === "reset") return go({ confirmReset: true });
  if (a === "reset-no") return go({ confirmReset: false });
  if (a === "reset-yes") { DB = seed(); saveDB(); return go({ confirmReset: false, screen: "login", authMode: "login", taskId: null, memberId: null, tab: "tasks" }); }
});
function scrollDetailTop() { const d = $("#detail-pane") || $(".pane"); if (d) d.scrollTop = 0; }
document.addEventListener("change", async e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.role) return;
  try { await Api.setRole(el.dataset.id, el.dataset.role, el.checked); render(); }
  catch (err) { el.checked = !el.checked; toast(err.message); }
});
function markCurrent(el) {
  document.querySelectorAll('#list-pane .row[aria-current]').forEach(r => r.removeAttribute("aria-current"));
  if (el) el.setAttribute("aria-current", "true");
}

document.addEventListener("input", e => {
  if (e.target.id === "q") { S.q = e.target.value; $("#task-list").innerHTML = taskListHTML(); }
  if (e.target.id === "mq") { S.mq = e.target.value; $("#member-list").innerHTML = memberListHTML(); }
  if (e.target.id === "code") e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "f-auth") {
    const email = f.email.value.trim(), pw = f.password.value, reg = S.authMode === "register";
    const errors = {};
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = "Bitte gib eine gültige E-Mail-Adresse ein.";
    if (!pw) errors.password = "Bitte gib ein Passwort ein.";
    else if (reg && (pw.length < 8 || !/\p{Lu}/u.test(pw) || !/\p{Ll}/u.test(pw) || !/\d/.test(pw))) errors.password = "Das Passwort braucht mindestens 8 Zeichen mit Großbuchstabe, Kleinbuchstabe und Ziffer.";
    if (Object.keys(errors).length) return go({ errors, error: "", email });
    go({ busy: true, errors: {}, error: "", email });
    try {
      if (reg) { const r = await Api.register(email, pw); go(r && r.status === "ok" ? { busy: false, tab: "tasks" } : { busy: false, screen: "verify" }); }
      else { await Api.login(email, pw); go({ busy: false, tab: "tasks" }); }
    } catch (err) {
      if (err.code === "unverified") return go({ busy: false, screen: "verify", error: "" });
      if (err.code === "exists") return go({ busy: false, authMode: "login", error: err.message });
      go({ busy: false, error: err.message });
    }
  }
  if (f.id === "f-verify") {
    go({ busy: true, error: "" });
    try { await Api.verify(S.email, f.code.value.trim()); go({ busy: false }); }
    catch (err) { go({ busy: false, error: err.message }); }
  }
  if (f.id === "f-reject") {
    const id = f.dataset.id, comment = f.comment.value.trim();
    go({ busy: true });
    try { await Api.rejectReport(id, comment); go({ busy: false, rejecting: null }); toast("Abgelehnt."); }
    catch (err) { go({ busy: false, rejecting: null }); toast(err.message); }
    return;
  }
  if (f.id === "f-since") {
    const id = f.dataset.id, v = f.since.value;
    if (!v) return go({ errors: { since: "Bitte wähle ein Datum." } });
    if (v > todayISO()) return go({ errors: { since: "Das Datum darf nicht in der Zukunft liegen." } });
    try { await Api.setSince(id, v); go({ errors: {} }); toast("Datum gespeichert."); }
    catch (err) { toast(err.message); }
    return;
  }
  if (f.id === "f-cat-add") {
    const name = f.name.value.trim();
    if (!name) return go({ errors: { catNew: "Bitte gib einen Namen ein." } });
    go({ busy: true, errors: {} });
    try { await Api.addCategory(name); go({ busy: false }); toast("Kategorie angelegt."); const i = $("#cat-new"); if (i) i.focus(); }
    catch (err) { go({ busy: false, errors: { catNew: err.message } }); }
    return;
  }
  if (f.id === "f-cat-rename") {
    const oldName = f.dataset.old, name = f.name.value.trim();
    if (!name) return go({ errors: { catRename: "Bitte gib einen Namen ein." } });
    if (name === oldName) return go({ catEdit: null, errors: {} });
    try { await Api.renameCategory(oldName, name); go({ catEdit: null, errors: {} }); toast("Kategorie umbenannt."); }
    catch (err) { go({ errors: { catRename: err.message } }); }
    return;
  }
  if (f.id === "f-task") {
    const id = f.dataset.id, t = readTask(f), errors = validateTask(t, id ? DB.tasks.find(x => x.id === id) : null);
    const next = !id && e.submitter && e.submitter.dataset.next === "1";
    if (Object.keys(errors).length) { go({ errors, error: "", taskDraft: t }); return; }
    go({ busy: true, errors: {}, error: "", taskDraft: t });
    try {
      if (id) { await Api.updateTask(id, t); go({ busy: false, editTask: null, taskDraft: null }); toast("Aufgabe gespeichert."); }
      else if (next) {
        await Api.createTask(t);
        go({ busy: false, editTask: "new", taskId: null, taskDraft: { title: "", description: "", category: t.category, interval: t.interval,
          points: 5, min: 1, total: 1, validFrom: t.validFrom, validTo: t.validTo } });
        scrollDetailTop(); const i = $("#te-title"); if (i) i.focus();
        toast(`„${t.title}“ angelegt. Jetzt die nächste.`);
      }
      else { const newId = await Api.createTask(t); go({ busy: false, editTask: null, taskDraft: null, taskId: newId, q: "", onlyMine: false }); toast("Aufgabe angelegt."); }
    }
    catch (err) { go({ busy: false, error: err.message }); }
    return;
  }
  if (f.id === "f-onboard" || f.id === "f-profile") {
    const p = readProfile(f), errors = validateProfile(p);
    const draftKey = f.id === "f-onboard" ? "draft" : "profileDraft";
    if (Object.keys(errors).length) return go({ errors, error: "", [draftKey]: p });
    go({ busy: true, errors: {}, error: "", [draftKey]: p });
    try {
      await Api.saveProfile(p);
      go({ busy: false, [draftKey]: null });
      if (f.id === "f-onboard") { S.tab = "tasks"; render(); toast(`Willkommen bei Chora, ${p.firstName}!`); }
      else toast("Profil gespeichert.");
    } catch (err) {
      go({ busy: false, errors: err.code === "chorId" ? { chorId: err.message } : {}, error: err.code === "chorId" ? "" : err.message });
    }
  }
});

let lastWide = wide();
addEventListener("resize", () => { const w = wide(); if (w !== lastWide) { lastWide = w; render(); } });

if (window.CHORA_PWA && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {});
  // Neue Version beim nächsten Start sofort übernehmen (nicht beim allerersten Besuch)
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController && !reloaded && S.screen !== "onboarding") { reloaded = true; location.reload(); }
  });
}

async function boot() {
  if (!CONFIG.mock && Remote.loadSession()) {
    S.screen = "loading"; render();
    try { await Remote.token(true); await reload(); S.screen = "app"; }
    catch (e) { Remote.clear(); CACHE.me = null; S.screen = "login"; if (e.code === "offline") S.error = e.message; }
  }
  render();
}
boot();
</script>

</body>
</html>
